<!DOCTYPE html>
<html>
<head>
    <title>Login Page</title>
</head>
<body bgcolor="lightblue">

<center>
    <h1>LOGIN PAGE</h1>

    <form>
        <table>
            <tr>
                <td><b>Username:</b></td>
                <td><input type="text" placeholder="Enter Username"></td>
            </tr>

            <tr>
                <td><b>Password:</b></td>
                <td><input type="password" placeholder="Enter Password"></td>
            </tr>

            <tr>
                <td><b>Email:</b></td>
                <td><input type="email" placeholder="Enter Email"></td>
            </tr>

            <tr>
                <td colspan="2" align="center">
                    <br>
                    <input type="submit" value="Login">
                    <input type="reset" value="Reset">
                </td>
            </tr>
        </table>
    </form>
</center>
<p>New User? <a href="registration form.html">Register Here</a></p>
</body>
</html>
